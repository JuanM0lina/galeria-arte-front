<div class="sky">
  <img
  *ngFor="let cloud of clouds; let i = index; trackBy: trackCloud"
  class="cloud"
  [src]="cloud.src"
  [style.top.%]="cloud.top"
  [style.width.px]="cloud.size"
  [style.animationDuration.s]="cloud.duration"
  (animationend)="recycleCloud(i)"
/>

</div>
