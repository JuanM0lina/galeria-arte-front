<marco-madera class="frame-container">
  <div class="content-container">

    <div class="div_top" style="margin-bottom: 20px; display: flex; justify-content: flex-start;">
      <app-btn-primary
        label="Crear Categoría"
        (click)="crearCategoria()">
      </app-btn-primary>
    </div>

    <div class="header-container">
      <h1 class="pixel-title">Categorías</h1>
      <app-btn-reporte tipo="categorias"></app-btn-reporte>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Buscar..." [(ngModel)]="terminoBusqueda" (input)="onSearch()" class="pixel-input">
    </div>

    <p *ngIf="cargando" style="text-align: center; color: white;">Cargando...</p>

    <div class="confirm-overlay" *ngIf="mostrarConfirmacion">
      <div class="confirm-box">
        <p>¿Estás seguro de eliminar "{{ catEliminar?.nombreCategoria }}"?</p>
        <div class="confirm-actions">
          <button (click)="confirmarEliminacion()" [disabled]="eliminando">Sí, eliminar</button>
          <button (click)="cancelarEliminacion()">Cancelar</button>
        </div>
      </div>
    </div>

    <div class="grid-categorias" *ngIf="!cargando">
      <marco-papel *ngFor="let cat of datosPaginados" class="card-categoria">
        <div class="card-content">
          <div class="cat-icon">🎨</div>
          <h2>{{ cat.nombreCategoria }}</h2>
          <p>{{ cat.descripcionCategoria }}</p>
          
          <div class="actions">
             <button class="btn-explorar" (click)="verObras(cat.idCategoria)">Explorar</button>
             <div class="admin-actions" style="margin-top: 10px; display: flex; gap: 10px; justify-content: center;">
                <button class="btn-edit-simple" (click)="editarCategoria(cat)">✏️</button>
                <app-btn-delete (click)="abrirConfirmacion(cat)"></app-btn-delete>
             </div>
          </div>

        </div>
      </marco-papel>
    </div>

    <div class="paginacion-controls" *ngIf="categoriasFiltradas.length > itemsPorPagina">
      <button (click)="anteriorPagina()" [disabled]="paginaActual === 0" class="btn-nav">◀</button>
      <span class="page-indicator">{{ paginaActual + 1 }} / {{ totalPaginas }}</span>
      <button (click)="siguientePagina()" [disabled]="paginaActual >= totalPaginas - 1" class="btn-nav">▶</button>
    </div>
  </div>
</marco-madera>
