<marco-madera class="frame-container">

  <div class="content-container">
    <h1 class="pixel-title">Categorías</h1>

    <div class="search-box">
      <input
        type="text"
        placeholder="Buscar categoría..."
        [(ngModel)]="terminoBusqueda"
        (input)="onSearch()"
        class="pixel-input"
      >
      <span class="search-icon">🔍</span>
    </div>

    <p *ngIf="cargando" class="loading-text">Cargando datos del servidor...</p>

    <p *ngIf="!cargando && categoriasFiltradas.length === 0" class="loading-text">
      No se encontraron resultados.
    </p>

    <div class="grid-categorias" *ngIf="!cargando">

      <marco-papel *ngFor="let cat of datosPaginados" class="card-categoria">
        <div class="card-content">
          <div class="cat-icon">🎨</div>
          <h2>{{ cat.nombreCategoria }}</h2>
          <p>{{ cat.descripcionCategoria }}</p>

          <button class="btn-explorar" (click)="verObras(cat.idCategoria, cat.nombreCategoria)">
            Explorar Obras
          </button>
        </div>
      </marco-papel>

    </div>

    <div class="paginacion-controls" *ngIf="categoriasFiltradas.length > itemsPorPagina">
      <button
        (click)="anteriorPagina()"
        [disabled]="paginaActual === 0"
        class="btn-nav">
        ◀
      </button>

      <span class="page-indicator">
        {{ paginaActual + 1 }} / {{ Math.ceil(categoriasFiltradas.length / itemsPorPagina) }}
      </span>

      <button
        (click)="siguientePagina()"
        [disabled]="(paginaActual + 1) * itemsPorPagina >= categoriasFiltradas.length"
        class="btn-nav">
        ▶
      </button>
    </div>
  </div>

</marco-madera>
