<marco-madera>
  
  <div class="div_container_all">

    <div class="div_top">
      <app-btn-primary
        label="Crear Colección"
        (click)="crearColeccion()">
      </app-btn-primary>
    </div>

    <div class="header-container">
      <h1 id="titulo">Colecciones</h1>
      <app-btn-reporte
        tipo="colecciones">
      </app-btn-reporte>
    </div>

    <div class="div_title">
      Lista de colecciones
    </div>

    <div class="div_controles">
      <div class="paginacion-controls" *ngIf="coleccionesFiltradas.length > itemsPorPagina">
        <button (click)="anteriorPagina()" [disabled]="paginaActual === 0" class="btn-nav">◀</button>
        <span class="page-indicator">{{ paginaActual + 1 }} / {{ totalPaginas }}</span>
        <button (click)="siguientePagina()" [disabled]="paginaActual >= totalPaginas - 1" class="btn-nav">▶</button>
      </div>

      <div class="search-box">
        <input type="text" placeholder="Buscar..." [(ngModel)]="terminoBusqueda" (input)="onSearch()" class="pixel-input">
      </div>
    </div>

    <p *ngIf="cargando" style="text-align: center; color: white;">Cargando...</p>

    <div class="grid-colecciones" *ngIf="!cargando">
      <marco-papel *ngFor="let col of datosPaginados" class="card-coleccion">
        <div class="card-content">
          <h2>{{ col.nombreColeccion }}</h2>
          <p class="desc">{{ col.descripcionColeccion }}</p>
          <div class="fechas">
            <span>📅 Inicio: {{ col.fechaInicio | date:'dd/MM/yyyy' }}</span>
            <span>🏁 Fin: {{ col.fechaFin | date:'dd/MM/yyyy' }}</span>
          </div>
          <button class="btn-ver" (click)="verObras(col.idColeccion)">Ver Obras</button>
        </div>
      </marco-papel>
    </div>

  </div>
</marco-madera>
